title: Shanshan Shen's Technical Blogs
author:
  name: © 2026. Shanshan Shen. All rights reserved.
url: https://shen-shanshan.github.io
baseurl: /technical-blogs
timezone: Asia/Shanghai

# The `>` after `description:` means to ignore line-breaks until next key.
# If you want to omit the line-break after the end of text, use `>-` instead.
description: >
  Technical blogs about LLM inference, vLLM and more.

# Build settings

future: true

remote_theme: jekyll/minima@5ce4006d175e6e5278bb63a0aad1a85e3bf2370b

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-gfm-admonitions
  - jekyll-redirect-from

exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - vendor

# Theme-specific settings

minima:
  skin: auto

  # Minima date format.
  # Refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this.
  #
  # date_format: "%b %-d, %Y"

  # Generate social links in footer.
  #
  social_links:
    - title: Shanshan Shen on GitHub
      icon: github
      url: "https://github.com/shen-shanshan"

# If you want to link only specific pages in your header, uncomment this and add the path to the pages in
# order as they should show up.
#
header_pages:
  - index.md

# Set to `true` to show excerpts on the homepage.
#
# show_excerpts: false
